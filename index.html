    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================================================
           1. GOOGLE APPS SCRIPT CONFIGURATION
           ========================================================================== */
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpd5SmsT7OkQwLPrTaSrFxNnrjteYULC_1uu2Lky5QWSd2aiM1e_dXoAniLAH24XSkKA/exec";

        /* ==========================================================================
           2. AUDIO SYNTHESIZER (WEB AUDIO API FOR SFX)
           ========================================================================== */
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // SFX: Pena Bulu Ayam (Quill sound)
        function playQuillSFX() {
            try {
                initAudioContext();
                const bufferSize = audioCtx.sampleRate * 0.12;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 3;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        // SFX: Tombol Klik / Medieval Bell
        function playClickSFX() {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        // SFX: Card Flip Swoosh
        function playFlipSFX() {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // SFX: Jawaban Benar (Chime Harpa Emas)
        function playCorrectSFX() {
            try {
                initAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.07);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.07 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.07);
                    osc.stop(audioCtx.currentTime + index * 0.07 + 0.3);
                });
            } catch(e) {}
        }

        // SFX: Jawaban Salah (Dissonant Gong)
        function playWrongSFX() {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        /* ==========================================================================
           3. YOUTUBE BGM PLAYER INTEGRATION
           ========================================================================== */
        let player = null;
        let isBgmPlaying = false;

        // Load YouTube API Script
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'rCYyx8b13cA', // Medieval Minstrel Music
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'rCYyx8b13cA'
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.setVolume(40);
        }

        function toggleBGM() {
            initAudioContext();
            const eq = document.getElementById('audio-eq');
            const icon = document.getElementById('bgm-icon');
            const text = document.getElementById('bgm-text');

            if (!player || typeof player.playVideo !== 'function') return;

            if (isBgmPlaying) {
                player.pauseVideo();
                isBgmPlaying = false;
                eq.classList.add('eq-paused');
                icon.className = "fa-solid fa-music";
                text.innerText = "Musik Dihentikan";
            } else {
                player.playVideo();
                isBgmPlaying = true;
                eq.classList.remove('eq-paused');
                icon.className = "fa-solid fa-volume-high text-gold-400";
                text.innerText = "Minstrel Bermusik";
            }
        }

        function changeVolume(val) {
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);

        /* ==========================================================================
           4. GOLD DUST PARTICLE CANVAS (60 FPS)
           ========================================================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * 0.8 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* ==========================================================================
           5. STATE MANAGEMENT & SLIDE DATA (14 SLIDES)
           ========================================================================== */
        let currentSlide = 1;
        const totalSlides = 14;

        // User Data Ksatria
        let studentInfo = {
            nama: '',
            kelas: '',
            sekolah: ''
        };

        // Data Kuis 10 Soal SMA Class XI

                ],

            },
            {

                    "C. Menyebutkan objek secara kiasan langsung tanpa pembanding",
                    "D. Pernyataan yang berlebihan melebihi kenyataan"
                ],
                answer: 0,

                answer: 1,

                            <div class="bg-amber-100/90 p-4 rounded-lg border border-amber-900/30 space-y-3 font-cormorant text-xs sm:text-sm">
                                <div>
                                    <h3 class="font-medieval text-crimson-900 font-bold">📌 Intisari Rangkuman:</h3>
                                    <p class="text-amber-950">Majas adalah instrumen utama pujangga untuk menyuntikkan jiwa ke dalam kata-kata. Memahami perbedaan Metafora, Personifikasi, Hiperbola, dan Simile mempertajam apresiasi sastra kita.</p>
                                </div>
                                <div>
                                    <h3 class="font-medieval text-crimson-900 font-bold">📖 Referensi Akademis:</h3>
                                    <ul class="list-disc list-inside text-amber-900 space-y-1">
                                        <li>Keraf, Gorys. (2009). <em>Diksi dan Gaya Bahasa</em>. Jakarta: Gramedia Pustaka Utama.</li>
                                        <li>Tarigan, Henry Guntur. (2013). <em>Pengajaran Gaya Bahasa</em>. Bandung: Angkasa.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        /* Helper Card 3D Flip */
        function renderFlipCard(id, title, subtitle, desc, icon) {
            return `
                <div class="perspective-1000 h-44 cursor-pointer" onclick="toggleCardFlip(this)">
                    <div class="transform-style-3d relative w-full h-full rounded-lg shadow-md border border-amber-900/30">
                        <!-- FRONT -->
                        <div class="flip-card-front absolute inset-0 bg-amber-100/90 p-3 flex flex-col items-center justify-center text-center rounded-lg">
                            <i class="fa-solid ${icon} text-2xl text-crimson-700 mb-2"></i>
                            <h3 class="font-cinzel text-sm font-bold text-amber-950">${title}</h3>
                            <p class="font-medieval text-xs text-amber-800 mt-1">${subtitle}</p>
                            <span class="text-[10px] text-amber-700/60 mt-3 font-medieval">Klik untuk balik 🔄</span>
                        </div>
                        <!-- BACK -->
                        <div class="flip-card-back absolute inset-0 bg-amber-900 text-amber-100 p-3 flex flex-col items-center justify-center text-center rounded-lg">
                            <h4 class="font-cinzel text-xs text-gold-400 font-bold mb-1">${title}</h4>
                            <p class="font-cormorant text-xs leading-tight">${desc}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleCardFlip(cardEl) {
            playFlipSFX();
            cardEl.classList.toggle('flipped');
        }

        function showPoemMajas(num) {
            playClickSFX();
            const box = document.getElementById('poem-analysis-box');
            box.classList.remove('hidden');
            if (num === 1) {
                box.innerHTML = `<strong>Baris 1:</strong> <em>"Sang surya mengedipkan matanya..."</em> 👉 <strong>Majas Personifikasi</strong>. Surya (matahari) diberi sifat manusia mengedipkan mata.`;
            } else if (num === 2) {
                box.innerHTML = `<strong>Baris 2:</strong> <em>"Hatinya seperti samudra..."</em> 👉 <strong>Majas Simile</strong>. Menggunakan kata pembanding eksplisit 'seperti'.`;
            } else if (num === 3) {
                box.innerHTML = `<strong>Baris 3:</strong> <em>"Memecahkan keheningan malam..."</em> 👉 <strong>Majas Hiperbola & Personifikasi</strong>. Menyampaikan efek dramatis kesedihan secara berlebihan.`;
            }
        }

        /* ==========================================================================
           7. FORMULIR IDENTITAS & KUIS INTERAKTIF (SLIDE 12)
           ========================================================================== */
        let currentQuizIndex = 0;

        function renderQuizSlide(container) {
            // Jika siswa belum mengisi identitas, tampilkan Formulir "Gulungan Pendaftaran Ksatria"
            if (!studentInfo.nama || !studentInfo.kelas || !studentInfo.sekolah) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-amber-100/90 p-5 rounded-lg border-2 border-gold-600 shadow-xl space-y-4 font-cormorant">
                        <div class="text-center space-y-1">
                            <div class="wax-seal w-12 h-12 rounded-full mx-auto flex items-center justify-center text-gold-300 font-cinzel text-lg shadow-md mb-2">
                                📜
                            </div>
                            <h3 class="font-cinzel text-lg text-crimson-900 font-bold">
                                GULUNGAN PENDAFTARAN KSATRIA
                            </h3>
                            <p class="font-medieval text-xs text-amber-900">
                                Isi identitasmu sebelum memasuki Ujian Kelayakan Ksatria Bahasa!
                            </p>
                        </div>

                        <form onsubmit="handleRegistration(event)" class="space-y-3 text-xs sm:text-sm">
                            <div>
                                <label class="block font-medieval text-amber-950 mb-1">Nama Lengkap Siswa:</label>
                                <input type="text" id="reg-nama" required placeholder="Contoh: Raden Wijaya" class="w-full p-2 bg-amber-50 border border-amber-900/40 rounded font-cormorant text-amber-950 focus:outline-none focus:border-crimson-700">
                            </div>
                            <div>
                                <label class="block font-medieval text-amber-950 mb-1">Kelas:</label>
                                <input type="text" id="reg-kelas" required placeholder="Contoh: XI-2 Bahasa" class="w-full p-2 bg-amber-50 border border-amber-900/40 rounded font-cormorant text-amber-950 focus:outline-none focus:border-crimson-700">
                            </div>
                            <div>
                                <label class="block font-medieval text-amber-950 mb-1">Asal Sekolah:</label>
                                <input type="text" id="reg-sekolah" required placeholder="Contoh: SMAN 1 Karawang" class="w-full p-2 bg-amber-50 border border-amber-900/40 rounded font-cormorant text-amber-950 focus:outline-none focus:border-crimson-700">
                            </div>

                            <button type="submit" class="w-full py-2.5 bg-crimson-700 hover:bg-crimson-800 text-gold-300 border border-gold-500 rounded font-medieval font-bold tracking-wider transition shadow-md">
                                ⚔️ MULAI UJIAN KUIS (10 SOAL) ⚔️
                            </button>
                        </form>
                    </div>
                `;
                return;
            }

            // Tampilan Soal Kuis
            const q = quizQuestions[currentQuizIndex];
            container.innerHTML = `
                <div class="space-y-4 font-cormorant">
                    <!-- Progress Bar & Student Badge -->
                    <div class="flex justify-between items-center text-xs bg-amber-200/60 p-2 rounded border border-amber-900/20">
                        <span class="font-medieval text-amber-900">
                            🏰 Ksatria: <strong>${studentInfo.nama}</strong> (${studentInfo.kelas})
                        </span>
                        <span class="font-cinzel text-crimson-900 font-bold">
                            Soal ${currentQuizIndex + 1} dari 10
                        </span>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-amber-100/90 p-4 rounded-lg border border-amber-900/30 shadow-sm space-y-3">
                        <p class="whitespace-pre-line text-sm sm:text-base font-semibold text-amber-950">
                            ${q.question}
                        </p>

                        <!-- Options -->
                        <div class="space-y-2 mt-3">
                            ${q.options.map((opt, idx) => {
                                const isSelected = userAnswers[currentQuizIndex] === idx;
                                return `
                                    <button onclick="selectAnswer(${idx})" class="w-full text-left p-2.5 rounded text-xs sm:text-sm border transition flex items-center justify-between ${isSelected ? 'bg-crimson-800 text-gold-200 border-gold-500 font-bold' : 'bg-amber-50 hover:bg-amber-200 text-amber-950 border-amber-900/20'}">
                                        <span>${opt}</span>
                                        ${isSelected ? '<i class="fa-solid fa-check-circle text-gold-400"></i>' : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Quiz Question Navigation -->
                    <div class="flex justify-between items-center pt-2">
                        <button onclick="prevQuestion()" ${currentQuizIndex === 0 ? 'disabled' : ''} class="px-3 py-1 bg-stone-800 text-amber-200 text-xs rounded font-medieval disabled:opacity-40">
                            ← Soal Lalu
                        </button>

                        <div class="flex space-x-1">
                            ${quizQuestions.map((_, i) => `
                                <button onclick="jumpToQuestion(${i})" class="w-6 h-6 text-[10px] rounded font-bold ${userAnswers[i] !== null ? 'bg-crimson-700 text-amber-100' : 'bg-amber-200 text-amber-900'} ${currentQuizIndex === i ? 'ring-2 ring-gold-500' : ''}">
                                    ${i + 1}
                                </button>
                            `).join('')}
                        </div>

                        ${currentQuizIndex === 9 ? `
                            <button onclick="submitQuiz()" class="px-3 py-1 bg-gold-600 hover:bg-gold-500 text-amber-950 text-xs rounded font-medieval font-bold border border-amber-900">
                                Kirim Nilai 📜
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="px-3 py-1 bg-crimson-700 text-amber-100 text-xs rounded font-medieval">
                                Soal Lanjut →
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function handleRegistration(e) {
            e.preventDefault();
            playClickSFX();
            studentInfo.nama = document.getElementById('reg-nama').value.trim();
            studentInfo.kelas = document.getElementById('reg-kelas').value.trim();
            studentInfo.sekolah = document.getElementById('reg-sekolah').value.trim();
            renderSlideContent();
        }

        function selectAnswer(optIdx) {
            playClickSFX();
            userAnswers[currentQuizIndex] = optIdx;
            renderSlideContent();
        }

        function nextQuestion() {
            if (currentQuizIndex < 9) {
                currentQuizIndex++;
                renderSlideContent();
            }
        }

        function prevQuestion() {
            if (currentQuizIndex > 0) {
                currentQuizIndex--;
                renderSlideContent();
            }
        }

        function jumpToQuestion(idx) {
            currentQuizIndex = idx;
            renderSlideContent();
        }

        function submitQuiz() {
            playClickSFX();
            // Check if all answered
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (!confirm(`Masih ada ${unanswered} soal yang belum dijawab. Yakin ingin menyelesaikan sekarang?`)) {
                    return;
                }
            }
            quizSubmitted = true;
            goToSlide(13);
        }

        /* ==========================================================================
           8. REKAP NILAI & INTEGRASI GOOGLE APPS SCRIPT (SLIDE 13)
           ========================================================================== */
        let postAttempted = false;
        let postSuccess = false;

        function calculateScore() {
            let correct = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizQuestions[idx].answer) {
                    correct++;
                }
            });
            const score = correct * 10;
            
            let gelar = "Prajurit Magang";
            if (score >= 90) {
                gelar = "Master Pujangga Istana 👑";
            } else if (score >= 70) {
                gelar = "Ksatria Bahasa Utama ⚔️";
            }

            return { correct, score, gelar };
        }

        function renderScoreSlide(container) {
            const { correct, score, gelar } = calculateScore();

            // Jalankan Pengiriman Data ke Google Apps Script (Hanya Sekali)
            if (!postAttempted && studentInfo.nama) {
                sendDataToGoogleSheets(score, gelar);
            }

            if (score >= 70) {
                playCorrectSFX();
            } else {
                playWrongSFX();
            }

            container.innerHTML = `
                <div class="space-y-4 font-cormorant text-center py-2">
                    <div class="wax-seal w-16 h-16 rounded-full mx-auto flex items-center justify-center text-gold-300 font-cinzel text-2xl shadow-xl">
                        🏆
                    </div>

                    <h2 class="font-cinzel text-xl sm:text-2xl text-crimson-900 font-bold">
                        PIAGAM HASIL UJIAN KSATRIA BAHASA
                    </h2>

                    <!-- Parchment Certificate Box -->
                    <div class="bg-amber-100/90 p-4 sm:p-6 rounded-lg border-2 border-gold-600 shadow-md max-w-lg mx-auto space-y-3">
                        <p class="font-medieval text-xs text-amber-900 uppercase tracking-widest">Diberikan Kepada:</p>
                        <h3 class="font-cinzel text-lg sm:text-xl font-bold text-amber-950">${studentInfo.nama || 'Pujangga Tanpa Nama'}</h3>
                        <p class="font-medieval text-xs text-amber-900">${studentInfo.kelas || '-'} | ${studentInfo.sekolah || '-'}</p>

                        <div class="w-full h-px bg-amber-900/20 my-2"></div>

                        <div class="flex justify-around items-center my-3">
                            <div>
                                <span class="text-xs font-medieval text-amber-800 block">Skor Kuis:</span>
                                <span class="font-cinzel text-2xl sm:text-3xl font-extrabold text-crimson-800">${score}/100</span>
                            </div>
                            <div>
                                <span class="text-xs font-medieval text-amber-800 block">Jawaban Benar:</span>
                                <span class="font-cinzel text-2xl sm:text-3xl font-extrabold text-amber-900">${correct}/10</span>
                            </div>
                        </div>

                        <div class="bg-amber-200/70 p-2 rounded border border-gold-600/50">
                            <span class="text-xs font-medieval text-amber-900 block">Gelar Kehormatan Medieval:</span>
                            <span class="font-cinzel text-sm sm:text-base font-bold text-crimson-900">${gelar}</span>
                        </div>
                    </div>

                    <!-- Status Pengiriman Google Apps Script Badge -->
                    <div id="gas-status-badge" class="max-w-lg mx-auto p-3 rounded-lg text-xs font-medieval flex items-center justify-center space-x-2 bg-amber-200 text-amber-950 border border-amber-900/30">
                        <i class="fa-solid fa-spinner fa-spin text-crimson-700"></i>
                        <span>Mengirim Data Nilai ke Google Sheet Rekap Kerajaan...</span>
                    </div>

                    <!-- Tombol Ulangi -->
                    <button onclick="resetQuiz()" class="px-4 py-2 bg-stone-800 hover:bg-amber-900 text-amber-200 text-xs rounded font-medieval border border-gold-600">
                        🔄 Ulangi Kuis Ksatria
                    </button>
                </div>
            `;
        }

        function sendDataToGoogleSheets(score, gelar) {
            postAttempted = true;
            const payload = {
                nama: studentInfo.nama,
                kelas: studentInfo.kelas,
                sekolah: studentInfo.sekolah,
                skor: score,
                totalSoal: 10,
                gelar: gelar
            };

            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Penting untuk bypass CORS Google Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                postSuccess = true;
                const badge = document.getElementById('gas-status-badge');
                if (badge) {
                    badge.className = "max-w-lg mx-auto p-3 rounded-lg text-xs font-medieval flex items-center justify-center space-x-2 bg-emerald-100 text-emerald-900 border border-emerald-600 shadow-sm";
                    badge.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i> <span>📜 Data Nilai Ksatria Berhasil Terkirim ke Rekap Kerajaan!</span>`;
                }
            })
            .catch(err => {
                const badge = document.getElementById('gas-status-badge');
                if (badge) {
                    badge.className = "max-w-lg mx-auto p-3 rounded-lg text-xs font-medieval flex items-center justify-center space-x-2 bg-amber-100 text-amber-950 border border-amber-600";
                    badge.innerHTML = `<i class="fa-solid fa-paper-plane text-crimson-700"></i> <span>Laporan Nilai Siap di Lembar Kerajaan.</span>`;
                }
            });
        }

        function resetQuiz() {
            playClickSFX();
            userAnswers = new Array(10).fill(null);
            currentQuizIndex = 0;
            quizSubmitted = false;
            postAttempted = false;
            goToSlide(12);
        }

        /* ==========================================================================
           9. NAVIGATION ENGINE
           ========================================================================== */
        function goToSlide(slideNum) {
            if (slideNum >= 1 && slideNum <= totalSlides) {
                currentSlide = slideNum;
                updateNavigationUI();
                renderSlideContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                goToSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                goToSlide(currentSlide - 1);
            }
        }

        /* Keyboard Arrow Key Navigation */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        /* ==========================================================================
           10. INITIALIZATION ON WINDOW LOAD
           ========================================================================== */
        window.onload = function() {
            initSlideSelect();
            updateNavigationUI();
            renderSlideContent();
        };
    </script>
</body>
</html>
